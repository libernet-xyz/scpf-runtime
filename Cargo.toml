[package]
name = "starkom-scpf"
version = "1.0.0"
description = "Starkom SCPF runtime."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/scpf-runtime.git"
readme = "README.md"
edition = "2024"
links = "starkom-scpf-v1"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
primitive-types = "0.14.0"
prost = "0.14.4"
starkom-ff = "4.2.0"

[build-dependencies]
prost-build = "0.14.4"
